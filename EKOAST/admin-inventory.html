<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Admin</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #ff6600;
        --admin-dark: #001f3f;
        --admin-bg: #f4f7f6;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        padding: 0 10px;
      }
      .sidebar-logo img {
        height: 32px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 700;
        color: white;
      }

      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #a0aec0;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-nav button i {
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 102, 0, 0.1);
        color: var(--admin-accent);
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        color: var(--admin-dark);
        margin: 0;
      }

      .section-card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .section-card h2 {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        margin-bottom: 24px;
        color: var(--admin-dark);
        border-left: 4px solid var(--admin-accent);
        padding-left: 15px;
      }

      .admin-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: #a0aec0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .admin-table tbody tr {
        background: white;
        transition: 0.2s;
      }
      .admin-table tbody tr:hover {
        background: #f8fafc;
      }
      .admin-table td {
        padding: 16px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
        color: #4a5568;
      }

      .btn-mini {
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        border: none;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid #e2e8f0;
        color: #4a5568;
      }
      .btn-outline:hover {
        background: #f8fafc;
        border-color: #cbd5e0;
      }

      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 31, 63, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        transform: translateY(20px);
        transition: transform 0.3s;
      }
      .modal-overlay.active .modal-content {
        transform: translateY(0);
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e2e8f0;
      }
      .modal-header h3 {
        margin: 0;
        font-family: "Playfair Display", serif;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #a0aec0;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        font-family: inherit;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .checkbox-group input {
        width: auto;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Edit Product Modal -->
    <div class="modal-overlay" id="editModalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Product</h3>
          <button class="modal-close" id="closeEditModal">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="editProductForm">
              <option value="Phones|Google Pixel">Phones - Google Pixel</option>
              <option value="Phones|Infinix">Phones - Infinix</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Home Appliances">Home Appliances</option>
              <option value="Desktop & Laptops">Desktop & Laptops</option>
              <!-- Other Catalogue can be added here -->
            </select>
          </div>
          <div class="form-group">
            <label>Update Image</label>
            <input type="file" id="editProductImage" accept="image/*" />
            <div id="editImagePreviewContainer" style="margin-top: 10px">
              <img
                id="editImagePreview"
                src=""
                alt="Preview"
                style="
                  max-width: 100%;
                  height: 80px;
                  object-fit: cover;
                  border-radius: 4px;
                  border: 1px solid #e2e8f0;
                "
              />
            </div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="editProductSoldOut" />
            <label for="editProductSoldOut" style="margin: 0; color: #e53e3e"
              >Mark as Sold Out</label
            >
          </div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn-mini btn-outline"
              id="cancelEditModal"
            >
              Cancel
            </button>
            <button type="submit" class="btn-mini btn-primary">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-logo">
          <img src="logo.png" alt="E" />
          <span></span>
        </div>

        <nav class="sidebar-nav">
          <button class="tab-btn" onclick="window.location.href = 'admin.html'">
            <i class="fas fa-chart-line"></i> <span>Overview</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-sales.html'"
          >
            <i class="fas fa-exchange-alt"></i> <span>Sales Queue</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-users.html'"
          >
            <i class="fas fa-users-cog"></i> <span>User Management</span>
          </button>
          <button
            class="tab-btn active"
            onclick="window.location.href = 'admin-inventory.html'"
          >
            <i class="fas fa-boxes"></i> <span>Inventory</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-upload.html'"
          >
            <i class="fas fa-upload"></i> <span>Upload Product</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-reviews.html'"
          >
            <i class="fas fa-star-half-alt"></i> <span>Reviews & Reports</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-chats.html'"
          >
            <i class="fas fa-comments"></i> <span>Chat Management</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-super.html'"
          >
            <i class="fas fa-bolt" style="color: #fc8181"></i>
            <span style="color: #fc8181; font-weight: 600">Super Admin</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-subadmins.html'"
          >
            <i class="fas fa-user-shield"></i> <span>Sub-Admins</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-shipping.html'"
          >
            <i class="fas fa-truck-loading"></i> <span>Shipping Settings</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-vouchers.html'"
          >
            <i class="fas fa-ticket-alt"></i> <span>Vouchers</span>
          </button>
        </nav>

        <div style="margin-top: auto; padding-top: 20px">
          <button
            id="logoutBtn"
            class="btn-mini btn-outline"
            style="
              width: 100%;
              border-color: rgba(255, 255, 255, 0.2);
              color: white;
            "
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <h1>Inventory</h1>
            <p
              id="adminEmail"
              class="muted"
              style="font-size: 13px; margin-top: 5px"
            ></p>
          </div>
          <div class="header-actions">
            <button
              class="btn-mini btn-primary"
              onclick="window.location.href = 'admin-upload.html'"
            >
              <i class="fas fa-plus"></i> Upload New Product
            </button>
          </div>
        </header>

        <section id="productsSection" class="tab-content">
          <div class="section-card">
            <h2>Inventory Management</h2>
            <div class="table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Source</th>
                    <th>Listing Price</th>
                    <th>Status</th>
                    <th>Control</th>
                  </tr>
                </thead>
                <tbody id="adminProductList"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="admin.js"></script>
    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #718096; text-align: center; padding: 10px; background: #f4f7f6;">this was made by opedemowo olaoluwa victor</div>
</body>
</html>
