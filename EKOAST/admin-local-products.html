<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekoast Local Product Admin</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-wrap {
        max-width: 900px;
        margin: 40px auto 120px;
      }
      .admin-card {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-md);
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .admin-grid .full {
        grid-column: 1 / -1;
      }
      .admin-list {
        margin-top: 20px;
        display: grid;
        gap: 10px;
      }
      .admin-item {
        background: #fff;
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      @media (max-width: 768px) {
        .admin-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="EKOAST â€” shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        
        <a href="index.html" class="btn btn-small">Back To Store</a>
      </div>
    </header>

    <main class="container admin-wrap">
      <section class="admin-card">
        <h1 style="margin-bottom: 16px">Local Product Admin</h1>
        <p class="muted" style="margin-bottom: 16px">
          Products added here are saved in browser localStorage and appear
          instantly when source mode is set to local.
        </p>

        <form id="localProductForm" class="admin-grid">
          <input id="name" placeholder="Product name" required />
          <input id="price" type="number" placeholder="Price (NGN)" required />
          <input id="category" placeholder="Category key (e.g. electronics)" required />
          <input id="stock" type="number" placeholder="Stock" required />
          <input id="image" class="full" placeholder="Image URL or local path (e.g. assets/images/item.jpg)" required />
          <textarea id="description" class="full" rows="3" placeholder="Description"></textarea>
          <button class="btn full" type="submit">Add Local Product</button>
        </form>
      </section>

      <section class="admin-card" style="margin-top: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <h2 style="font-size: 18px">Saved Local Products</h2>
          <button id="refreshBtn" class="btn btn-small">Refresh</button>
        </div>
        <div id="localProductsList" class="admin-list"></div>
      </section>
    </main>

    <script type="module" src="admin-local-products.js"></script>
      <script src="compliance.js" defer></script></body>
</html>
