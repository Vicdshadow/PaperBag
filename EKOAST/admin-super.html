<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin Controls</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #111116;
        --admin-dark: #111116;
        --admin-bg: #ffffff;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        padding: 0 10px;
      }
      .sidebar-logo img {
        height: 32px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
        color: white;
      }

      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #9a9aa2;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-nav button i {
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 102, 0, 0.1);
        color: var(--admin-accent);
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-family: "Fraunces", serif;
        font-size: 28px;
        color: var(--admin-dark);
        margin: 0;
      }

      .section-card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
      }
      .section-card h2 {
        font-family: "Fraunces", serif;
        font-size: 20px;
        margin-bottom: 24px;
        color: var(--admin-dark);
        border-left: 4px solid #b42318; /* Red for super admin */
        padding-left: 15px;
      }

      .admin-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: #9a9aa2;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .admin-table tbody tr {
        background: white;
        transition: 0.2s;
      }
      .admin-table tbody tr:hover {
        background: #f8f8fa;
      }
      .admin-table td {
        padding: 16px;
        border-bottom: 1px solid #f1f1f4;
        font-size: 14px;
        color: #33333b;
      }

      .btn-mini {
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        border: none;
      }
      .btn-primary {
        background: var(--admin-accent);
        color: white;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid #e6e6ea;
        color: #33333b;
      }
      .btn-outline:hover {
        background: #f8f8fa;
        border-color: #d4d4da;
      }/* Status Overrides */
      .status-pill {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .status-suspended {
        background: #fee2e2;
        color: #c53030;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />

    <meta name="color-scheme" content="light" />
  </head>
  <body>

      <aside class="admin-sidebar">
        

        <nav class="sidebar-nav">

          <button

          <button

          <button

          <button

            onclick="window.location.href = 'admin-shipping.html'"

            <i class="fas fa-truck-loading"></i> <span>Shipping Settings</span>
          </button>
        </nav>

        <div style="margin-top: auto; padding-top: 20px">
          <button
            id="logoutBtn"
            class="btn-mini btn-outline"
            style="
              width: 100%;
              border-color: rgba(255, 255, 255, 0.2);
              color: white;
            "
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <h1>
              Super Admin Controls
              <span
                style="
                  font-size: 14px;
                  background: #b42318;
                  color: white;
                  padding: 4px 8px;
                  border-radius: 4px;
                  vertical-align: middle;
                  margin-left: 10px;
                "
                ><i class="fas fa-lock-open"></i> UNLOCKED</span
              >
            </h1>
            <p
              id="adminEmail"
              class="muted"
              style="font-size: 13px; margin-top: 5px"
            ></p>
          </div>
        </header>

        <div class="stats-grid">
          <div class="stat-card" style="border-top: 4px solid #b42318">
            <h3>Total Suspended Accounts</h3>
            <div id="suspendedCount" class="value" style="color: #c53030">
              0
            </div>
          </div>
          <div class="stat-card">
            <h3>Warning</h3>
            <div style="font-size: 12px; color: #33333b; margin-top: 10px">
              Actions here are irreversible. Ensure you verify user identities
              before deleting accounts.
            </div>
          </div>
        </div>

        <section id="usersSection" class="tab-content">
          <div class="section-card">
            <h2>Danger Zone: User Authority</h2>
            <div class="table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>
                      Super Actions
                      <i
                        class="fas fa-exclamation-circle"
                        style="color: #b42318"
                      ></i>
                    </th>
                  </tr>
                </thead>
                <tbody id="adminSuperUserList">
                  <tr>
                    <td colspan="4">Loading data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
