<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Admin Panel</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #111116;
        --admin-dark: #111116;
        --admin-bg: #ffffff;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        padding: 0 10px;
      }
      .sidebar-logo img {
        height: 32px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
        color: white;
      }

      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #9a9aa2;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-nav button i {
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 102, 0, 0.1);
        color: var(--admin-accent);
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-family: "Fraunces", serif;
        font-size: 28px;
        color: var(--admin-dark);
        margin: 0;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
        margin-bottom: 40px;
      }
      .stat-card {
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .stat-card h3 {
        font-size: 12px;
        color: #55555e;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
        font-weight: 600;
        font-family: "Inter", sans-serif;
      }
      .stat-card .value {
        font-size: 26px;
        font-weight: 800;
        color: #1a202c;
        letter-spacing: -0.02em;
      }

      .section-card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .section-card h2 {
        font-family: "Fraunces", serif;
        font-size: 20px;
        margin-bottom: 24px;
        color: var(--admin-dark);
        border-left: 4px solid var(--admin-accent);
        padding-left: 15px;
      }

      .admin-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: #9a9aa2;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .admin-table tbody tr {
        background: white;
        transition: 0.2s;
      }
      .admin-table tbody tr:hover {
        background: #f8f8fa;
      }
      .admin-table td {
        padding: 16px;
        border-bottom: 1px solid #f1f1f4;
        font-size: 14px;
        color: #33333b;
      }

      .status-pill {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .status-escrow {
        background: #fffaf0;
        color: #dd6b20;
      }
      .status-verified {
        background: #ebf8ff;
        color: #2b6cb0;
      }
      .status-released {
        background: #f0fff4;
        color: #2f855a;
      }

      .btn-mini {
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        border: none;
      }
      .btn-primary {
        background: var(--admin-accent);
        color: white;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid #e6e6ea;
        color: #33333b;
      }
      .btn-outline:hover {
        background: #f8f8fa;
        border-color: #d4d4da;
      }

      /* Toasts */
      #toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .admin-toast {
        background: white;
        border-left: 4px solid var(--admin-accent);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 300px;
        animation: slideInRight 0.3s ease-out forwards;
      }
      .toast-icon {
        color: var(--admin-accent);
        font-size: 20px;
        margin-top: 2px;
      }
      .toast-title {
        font-weight: 700;
        font-size: 14px;
        color: var(--admin-dark);
        margin-bottom: 4px;
      }
      .toast-message {
        font-size: 12px;
        color: #33333b;
      }
      .toast-close {
        background: none;
        border: none;
        color: #9a9aa2;
        cursor: pointer;
        padding: 0;
        margin-left: auto;
      }
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="EKOAST â€” shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="toast-container"></div>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        

        <nav class="sidebar-nav">
          <button
            class="tab-btn active"
            onclick="window.location.href = 'admin.html'"
          >
            <i class="fas fa-chart-line"></i> <span>Overview</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-sales.html'"
          >
            <i class="fas fa-exchange-alt"></i> <span>Sales Queue</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-users.html'"
          >
            <i class="fas fa-users-cog"></i> <span>User Management</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-inventory.html'"
          >
            <i class="fas fa-boxes"></i> <span>Inventory</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-upload.html'"
          >
            <i class="fas fa-upload"></i> <span>Upload Product</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-reviews.html'"
          >
            <i class="fas fa-star-half-alt"></i> <span>Reviews & Reports</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-chats.html'"
          >
            <i class="fas fa-comments"></i> <span>Chat Management</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-vouchers.html'"
          >
            <i class="fas fa-ticket-alt"></i> <span>Vouchers</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-super.html'"
          >
            <i class="fas fa-bolt" style="color: #f97066"></i>
            <span style="color: #f97066; font-weight: 600">Super Admin</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-subadmins.html'"
          >
            <i class="fas fa-user-shield"></i> <span>Sub-Admins</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-shipping.html'"
          >
            <i class="fas fa-truck-loading"></i> <span>Shipping Settings</span>
          </button>
        </nav>

        <div style="margin-top: auto; padding-top: 20px">
          <button
            id="logoutBtn"
            class="btn-mini btn-outline"
            style="
              width: 100%;
              border-color: rgba(255, 255, 255, 0.2);
              color: white;
            "
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <h1>Command Center</h1>
            <p
              id="adminEmail"
              class="muted"
              style="font-size: 13px; margin-top: 5px"
            ></p>
          </div>
          <div class="header-actions">
            <button class="btn-mini btn-outline" onclick="location.reload()">
              <i class="fas fa-sync"></i> Refresh
            </button>
          </div>
        </header>

        <div id="overviewSection" class="tab-content">
          <div class="stats-grid">
            <div class="stat-card">
              <h3>Pending Payment Confirmations</h3>
              <div id="escrowTotal" class="value">?0</div>
            </div>
            <div class="stat-card">
              <h3>Pending Verifications</h3>
              <div id="pendingCount" class="value">0</div>
            </div>
            <div id="sellerStatCard" class="stat-card">
              <h3>Total Sellers</h3>
              <div id="totalSellersCount" class="value">0</div>
            </div>
            <div class="stat-card">
              <h3>Total Buyers</h3>
              <div id="totalBuyersCount" class="value">0</div>
            </div>
            <div class="stat-card">
              <h3>Unread Chats</h3>
              <div id="unreadChatsCount" class="value">0</div>
            </div>
            <div class="stat-card">
              <h3>Total Volume</h3>
              <div id="releasedTotal" class="value">?0</div>
            </div>
          </div>

          <div class="section-card">
            <h2>Recent System Alerts</h2>
            <div id="systemAlertsList">
              <p class="muted" style="font-size: 14px">
                Loading system status...
              </p>
            </div>
          </div>

          <div class="section-card" style="margin-top: 24px">
            <h2>Recent Account Signups</h2>
            <div id="recentAccountsList">
              <p class="muted" style="font-size: 14px">
                Loading recent signups...
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="admin.js"></script>
    <script type="module" src="auth-state.js"></script>

</html>
