        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">
          <a href="index.html">Shop</a>
          <a href="new-arrivals.html">New Arrivals</a>

        </nav>
        <a href="index.html" class="logo">

        <div class="nav-icons">

              type="text"
              id="searchInput"
              placeholder="Search..."
            />
            <i class="fas fa-times-circle search-clear" id="clearSearch"></i>
          </div>
          <a href="account.html"><i class="far fa-user"></i></a>
          <a href="cart.html" class="cart-link">

    <main class="subsections-page container animate-fade-in">
      <h1 class="section-title">Bicycles</h1>

      <div class="subsections-grid">
        <!-- Mountain Bikes -->
        <div class="product-card">
          <a href="index.html?cat=bicycles&sub=Mountain%20Bikes">
            <div class="product-image">
              <img
                src="assets/images/mountain bike.jpg"
                alt="Mountain Bikes"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1576435728678-be95e39e565d?auto=format&fit=crop&w=600&q=60'
                "
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Mountain Bikes</h3>
            </div>
          </a>
        </div>

        <!-- Road Bikes -->
        <div class="product-card">
          <a href="index.html?cat=bicycles&sub=Road%20Bikes">
            <div class="product-image">
              <img
                src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=600&q=60"
                alt="Road Bikes"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Road Bikes</h3>
            </div>
          </a>
        </div>

        <!-- Kids' Bikes -->
        <div class="product-card">
          <a href="index.html?cat=bicycles&sub=Kids'%20Bikes">
            <div class="product-image">
              <img
                src="assets/images/kids bicycle.jpg"
                alt="Kids' Bikes"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1596733430284-f74377bc2bd6?auto=format&fit=crop&w=600&q=60'
                "
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Kids' Bikes</h3>
            </div>
          </a>
        </div>

        <!-- Electric Bikes -->
        <div class="product-card">
          <a href="index.html?cat=bicycles&sub=Electric%20Bikes">
            <div class="product-image">
              <img
                src="assets/images/electric bike.jpg"
                alt="Electric Bikes"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1571068316344-75bc76f778f7?auto=format&fit=crop&w=600&q=60'
                "
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Electric Bikes</h3>
            </div>
          </a>
        </div>

        <!-- Cycling Accessories -->
        <div class="product-card">
          <a href="index.html?cat=bicycles&sub=Cycling%20Accessories">
            <div class="product-image">
              <img
                src="https://images.unsplash.com/photo-1534885320675-b08aa131cc5e?auto=format&fit=crop&w=600&q=60"
                alt="Cycling Accessories"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Cycling Accessories</h3>
            </div>
          </a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container text-center">
        <div class="footer-bottom">
          &copy; 2024. All rights reserved.
        <div class="creator-credit" style="font-size: 10px; color: #718096; margin-top: 5px;">this was made by opedemowo olaoluwa victor</div>
        </div>
      </div>
    </footer>

    <script type="module" src="index.js"></script>
    <script src="slideshow.js" defer></script>
    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        getDocs,
        collection,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
      const cartCountEl = document.getElementById("cartCount");
      onAuthStateChanged(auth, async (user) => {
        if (!cartCountEl) return;
        let count = 0;
        if (user) {
          const snap = await getDocs(collection(db, "users", user.uid, "cart"));
          count = snap.docs.reduce((n, d) => n + (d.data().qty || 0), 0);
        } else {
          const guestCart = JSON.parse(
            localStorage.getItem("guest_cart") || "[]",
          );
          count = guestCart.reduce((n, i) => n + (i.qty || 0), 0);
        }
        cartCountEl.textContent = count;
        cartCountEl.style.display = count > 0 ? "flex" : "none";
      });
    </script>

    <script type="module" src="auth-state.js"></script>

</html>
