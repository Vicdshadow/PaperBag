<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Bag</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      .cart-page {
        padding: 60px 0;
        max-width: 1000px;
        margin: 0 auto;
      }
      .page-title {
        text-align: center;
        margin-bottom: 60px;
        font-size: 24px;
        font-weight: 400;
      }
      .cart-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 60px;
      }
      @media (max-width: 768px) {
        .cart-layout {
          grid-template-columns: 1fr;
        }
      }
      .cart-item {
        display: flex;
        gap: 20px;
        padding-bottom: 24px;
        border-bottom: 1px solid #f8f8fa;
        margin-bottom: 24px;
      }
      .cart-img {
        width: 100px;
        height: 120px;
        object-fit: cover;
        background: #f8f8fa;
      }
      .cart-details {
        flex-grow: 1;
      }
      .cart-name {
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .cart-price {
        color: #55555e;
        font-size: 13px;
      }
      .cart-controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
      }
      .qty-btn {
        background: none;
        border: 1px solid #e6e6ea;
        width: 24px;
        height: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .remove-btn {
        font-size: 12px;
        text-decoration: underline;
        color: #999;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }
      .cart-summary {
        background: #f8f8fa;
        padding: 32px;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .summary-total {
        border-top: 1px solid #e6e6ea;
        margin-top: 20px;
        padding-top: 20px;
        font-weight: 600;
        font-size: 16px;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="EKOAST â€” shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">
          <a href="index.html">Shop</a>
        </nav>
        
        <div class="nav-icons">
          <a href="index.html"><i class="fas fa-times"></i></a>
        </div>
      </div>
    </header>

    <div class="container cart-page animate-fade-in">
      <h1 class="page-title" style="font-weight: 600">Shopping Bag</h1>

      <div class="cart-layout">
        <div id="cartItemsList">
          <!-- Items injected by JS -->
          <p>Loading bag...</p>
        </div>

        <div
          class="cart-summary glass"
          style="
            border-radius: 12px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-md);
          "
        >
          <div class="summary-row">
            <span class="muted">Subtotal</span>
            <span id="subtotal" style="font-weight: 600">?0</span>
          </div>
          <div class="summary-row">
            <span class="muted">Shipping</span>
            <span class="muted">Calculated at checkout</span>
          </div>
          <div class="summary-row summary-total">
            <span style="font-size: 18px">Total</span>
            <span id="total" style="font-size: 20px; color: var(--color-accent)"
              >?0</span
            >
          </div>

          <a
            href="checkout.html"
            class="btn"
            style="width: 100%; text-align: center; margin-top: 24px"
            >Checkout</a
          >
          <div class="text-center mt-4">
            <a
              href="index.html"
              style="font-size: 13px; text-decoration: underline"
              >Continue Shopping</a
            >
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="cart.js"></script>
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="catalogue.html" class="nav-item">
        <i class="fas fa-list-ul"></i>
        <span>Catalogue</span>
      </a>
      <a href="cart.html" class="nav-item active">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
      </a>
      <a href="#" class="nav-item">
        <i class="far fa-heart"></i>
        <span>Wishlist</span>
      </a>
      <a href="account.html" class="nav-item">
        <i class="fas fa-user"></i>
        <span>Account</span>
      </a>
      <a href="chat.html" class="nav-item">
        <i class="fas fa-comments"></i>
        <span>Chat</span>
      </a>
    </nav>
      <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #55555e; text-align: center; padding: 10px; background: #ffffff;">this was made by opedemowo olaoluwa victor</div>
    <script src="compliance.js" defer></script></body>
</html>
