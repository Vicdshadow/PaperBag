<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Stay | Shortlets & Hotels</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .stay-hero {
        background: url("https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1200&q=80");
        background-size: cover;
        background-position: center;
        height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 50px;
      }
      .stay-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
      }
      .stay-search-box {
        position: relative;
        z-index: 2;
        background: white;
        padding: 30px;
        border-radius: 50px;
        display: flex;
        gap: 15px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 800px;
        align-items: center;
      }
      .stay-input-group {
        flex: 1;
        border-right: 1px solid #eee;
        padding-right: 15px;
      }
      .stay-input-group:last-child {
        border: none;
        flex: 0 0 auto;
      }
      .stay-input-group label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 5px;
        color: #888;
      }
      .stay-input-group input {
        border: none;
        font-size: 16px;
        width: 100%;
        outline: none;
        font-weight: 600;
        color: #333;
      }
      .stay-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
        padding-bottom: 60px;
      }
      .stay-card {
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      .stay-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .stay-rating {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
      }
      .stay-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .stay-price {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">
          <a href="index.html">Main Shop</a>
          <a href="-autos.html">Autos</a>
          <a href="-real-estate.html">Real Estate</a>
        </nav>
        <a href="index.html" class="logo">
          <!-- Logo removed -->
          <span
            style="
              font-size: 12px;
              font-weight: 600;
              color: #555;
              margin-left: 5px;
            "
            >STAY</span
          >
        </a>
        <div class="nav-icons">
          <a href="account.html"><i class="far fa-user"></i></a>
        </div>
      </div>
    </header>

    <div
      class="stay-hero animate-fade-in"
      style="height: 30vh; margin-bottom: 20px"
    >
      <div class="stay-overlay"></div>
      <div
        style="position: relative; z-index: 2; color: white; text-align: center"
      >
        <i class="fas fa-bed" style="font-size: 4rem; margin-bottom: 15px"></i>
        <h2 style="font-size: 2.5rem; margin: 0">Coming Soon</h2>
      </div>
    </div>

    <main
      class="container"
      style="text-align: center; padding: 40px 20px 100px"
    >
      <p
        style="font-size: 1.2rem; color: #666; max-width: 500px; margin: 0 auto"
      >
        We are currently revamping our shortlets and hotels experience to bring
        you the most comfortable stays. Check back later!
      </p>
      <a href="index.html" class="btn btn-primary" style="margin-top: 30px"
        >Return to Shop</a
      >
    </main>

    <script type="module" src="services.js"></script>
    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #718096; text-align: center; padding: 10px; background: #f4f7f6;">this was made by opedemowo olaoluwa victor</div>
</body>
</html>
