<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title> Stay | Shortlets & Hotels</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      .stay-hero {
        background: url("assets/images/remote/remote-2975b6edc4.jpg");
        background-size: cover;
        background-position: center;
        height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 50px;
      }
      .stay-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
      }
      .stay-search-box {
        position: relative;
        z-index: 2;
        background: white;
        padding: 30px;
        border-radius: 50px;
        display: flex;
        gap: 15px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 800px;
        align-items: center;
      }
      .stay-input-group {
        flex: 1;
        border-right: 1px solid #f8f8fa;
        padding-right: 15px;
      }
      .stay-input-group:last-child {
        border: none;
        flex: 0 0 auto;
      }
      .stay-input-group label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 5px;
        color: #888;
      }
      .stay-input-group input {
        border: none;
        font-size: 16px;
        width: 100%;
        outline: none;
        font-weight: 600;
        color: #1c1c22;
      }
      .stay-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
        padding-bottom: 60px;
      }
      .stay-card {
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      .stay-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .stay-rating {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
      }
      .stay-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .stay-price {
        font-weight: 700;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />

  </head>

      <div class="stay-overlay"></div>
      <div
        style="position: relative; z-index: 2; color: white; text-align: center"

        <i class="fas fa-bed" style="font-size: 4rem; margin-bottom: 15px"></i>
        <h2 style="font-size: 2.5rem; margin: 0">Coming Soon</h2>
      </div>
    </div>

    <main
