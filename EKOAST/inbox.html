<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="account-page inbox-page">
    <header class="account-header inbox-header">
      <div class="inbox-header-bar">
        <a href="account.html" class="inbox-back">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div class="inbox-header-text">
          <h1 class="inbox-title">Inbox</h1>
          <p class="inbox-subtitle">Curated conversations, elevated service</p>
        </div>
      </div>
    </header>

    <main class="account-container animate-fade-in inbox-main">
      <div class="inbox-tabs">
        <div class="inbox-tab active">Messages</div>
        <div class="inbox-tab">Notifications</div>
      </div>

      <section class="inbox-list">
        <div class="empty-state inbox-empty">
          <div class="inbox-empty-icon">
            <i class="fas fa-envelope-open"></i>
          </div>
          <h2>Your inbox is empty</h2>
          <p class="muted">
            When you contact sellers or get updates, they'll show up here.
          </p>
          <a href="index.html" class="btn btn-small inbox-cta"
            >START SHOPPING</a
          >
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="catalogue.html" class="nav-item">
        <i class="fas fa-list-ul"></i>
        <span>Catalogue</span>
      </a>
      <a href="cart.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
      </a>
      <a href="wishlist.html" class="nav-item">
        <i class="far fa-heart"></i>
        <span>Wishlist</span>
      </a>
      <a href="account.html" class="nav-item active">
        <i class="fas fa-user"></i>
        <span>Account</span>
      </a>
    </nav>

    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #718096; text-align: center; padding: 10px; background: #f4f7f6;">this was made by opedemowo olaoluwa victor</div>
</body>
</html>
