  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">

          <a href="account.html"><i class="far fa-user"></i></a>
          <a href="cart.html" class="cart-link">

    <main class="subsections-page container animate-fade-in">

          <a href="index.html?cat=lighting&sub=LED%20Bulbs">
            <div class="product-image slideshow-container">
              <img
                src="assets/images/LED Bulbs.avif"
                class="slide active"
                alt="LED Bulbs"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">LED Bulbs</h3>
            </div>
          </a>
        </div>
        <div class="product-card">
          <a href="index.html?cat=lighting&sub=Flood%20Lights">
            <div class="product-image slideshow-container">
              <img
                src="assets/images/Flood Lights.avif"
                class="slide active"
                alt="Flood Lights"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Flood Lights</h3>
            </div>
          </a>
        </div>
        <div class="product-card">
          <a href="index.html?cat=lighting&sub=Street%20Lights">
            <div class="product-image slideshow-container">
              <img
                src="assets/images/Street Light.avif"
                class="slide active"
                alt="Street Lights"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Street Lights</h3>
            </div>
          </a>
        </div>
        <div class="product-card">
          <a href="index.html?cat=lighting&sub=Solar%20Lights">
            <div class="product-image">
              <img
                src="assets/images/solar_panels.jpg"
                alt="Solar Lights"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=600&q=60'
                "
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Solar Lights</h3>
            </div>
          </a>
        </div>
        <div class="product-card">
          <a href="index.html?cat=lighting&sub=Decorative%20Lights">
            <div class="product-image">
              <img
                src="assets/images/lighting.jpg"
                alt="Decorative"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1517991104123-1d56a6e81ed9?auto=format&fit=crop&w=600&q=60'
                "
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Decorative Lights</h3>
            </div>
          </a>
        </div>
        <div class="product-card">
          <a href="index.html?cat=lighting&sub=Emergency%20Lamps">
            <div class="product-image slideshow-container">
              <img
                src="assets/images/Emergency Lamps.avif"
                class="slide active"
                alt="Emergency Lamps"
              />
            </div>
            <div class="product-info">
              <h3 class="product-title">Emergency Lamps</h3>

    <footer class="site-footer">
      <div class="container text-center">
        <div class="footer-bottom">

        <div class="creator-credit" style="font-size: 10px; color: #718096; margin-top: 5px;">this was made by opedemowo olaoluwa victor</div>
        </div>
      </div>
    </footer>

    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        getDocs,
        collection,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
      const cartCountEl = document.getElementById("cartCount");
      onAuthStateChanged(auth, async (user) => {
        if (!cartCountEl) return;
        let count = 0;
        if (user) {
          const snap = await getDocs(collection(db, "users", user.uid, "cart"));
          count = snap.docs.reduce((n, d) => n + (d.data().qty || 0), 0);
        } else {
          const guestCart = JSON.parse(
            localStorage.getItem("guest_cart") || "[]",
          );
          count = guestCart.reduce((n, i) => n + (i.qty || 0), 0);
        }
        cartCountEl.textContent = count;
        cartCountEl.style.display = count > 0 ? "flex" : "none";
      });
    </script>
