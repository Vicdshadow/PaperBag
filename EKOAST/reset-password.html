<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-center">
    <div class="card form-card">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="" style="height: 60px; width: auto" />
      </a>
      <h2>Reset Password</h2>
      <p class="muted" style="margin-bottom: 20px">
        Enter your new password below.
      </p>

      <form id="resetForm">
        <input
          type="password"
          id="newPassword"
          placeholder="New Password"
          required
          minlength="6"
        />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm New Password"
          required
        />
        <button class="btn" type="submit" style="width: 100%">
          Change Password
        </button>
      </form>
    </div>

    <script type="module" src="reset-password.js"></script>
    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #718096; text-align: center; padding: 10px; background: #f4f7f6;">this was made by opedemowo olaoluwa victor</div>
</body>
</html>
