<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account — </title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="preloader.js" defer></script>
  </head>
  <body class="signup-page">
    <!-- Preloader -->
    <div id="preloader" class="preloader">
      <div class="loader-content">
        <span class="loader-text">EK</span>
        <div class="loader-circle"></div>
        <span class="loader-text">AST</span>
      </div>
    </div>

    <div class="glass-card animate-fade-in">
      <div class="signup-header">
        <div
          class="brand-container"
          style="text-align: center; margin-bottom: 20px"
        >
          <a href="index.html" class="brand">
            <img
              src="logo.png"
              alt=""
              style="height: 40px; width: auto"
            />
          </a>
        </div>
        <h2>Create Account</h2>
        <p>Join the  premium marketplace</p>
      </div>

      <div
        style="
          background: rgba(245, 124, 0, 0.1);
          padding: 12px;
          border-radius: 12px;
          margin-bottom: 24px;
          border: 1px solid rgba(245, 124, 0, 0.2);
        "
      >
        <p
          style="font-size: 11px; color: #fbbf24; margin: 0; text-align: center"
        >
          Already have an account?
          <a
            href="login.html"
            style="color: var(--color-accent); font-weight: 700"
            >Log In</a
          >
        </p>
      </div>

      <form id="signupForm">
        <input type="hidden" name="role" id="roleInput" value="buyer" />

        <div class="premium-input-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="premium-input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
          />
        </div>

        <div class="premium-input-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="+234 813 794 8779"
            required
          />
        </div>

        <div class="premium-input-group">
          <label for="password">Password</label>
          <div style="position: relative">
            <input
              type="password"
              id="password"
              placeholder="Min. 6 characters"
              required
              minlength="6"
              style="padding-right: 46px !important"
            />
            <i
              class="fas fa-eye"
              id="togglePassword"
              style="
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: #94a3b8;
              "
            ></i>
          </div>
          <div class="password-strength">
            <div id="strengthBar" class="strength-bar"></div>
          </div>
        </div>

        <div class="premium-input-group">
          <label for="confirmPassword">Confirm Password</label>
          <div style="position: relative">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
              required
              style="padding-right: 46px !important"
            />
            <i
              class="fas fa-eye"
              id="toggleConfirmPassword"
              style="
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: #94a3b8;
              "
            ></i>
          </div>
        </div>

        <button class="btn-premium" type="submit">Create Account</button>

        <div class="divider">
          <span>OR</span>
        </div>

        <button type="button" id="googleBtn" class="btn-premium-outline">
          <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            width="20"
            alt="G"
          />
          Continue with Google
        </button>
      </form>
    </div>

    <script type="module" src="signup.js"></script>
    <script>
      // Password visibility toggles
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      const toggleConfirmPassword = document.getElementById(
        "toggleConfirmPassword",
      );
      const confirmPasswordInput = document.getElementById("confirmPassword");

      togglePassword.addEventListener("click", function () {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);
        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
      });

      toggleConfirmPassword.addEventListener("click", function () {
        const type =
          confirmPasswordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        confirmPasswordInput.setAttribute("type", type);
        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
      });

      // Role is now fixed to buyer
      const roleInput = document.getElementById("roleInput");
      localStorage.setItem("intended_role", "buyer");

      // Password strength meter
      const strengthBar = document.getElementById("strengthBar");
      passwordInput.addEventListener("input", () => {
        const val = passwordInput.value;
        strengthBar.className = "strength-bar";
        if (val.length === 0) return;

        if (val.length < 6) {
          strengthBar.classList.add("strength-weak");
        } else if (val.length >= 6 && val.length < 10) {
          strengthBar.classList.add("strength-medium");
        } else {
          strengthBar.classList.add("strength-strong");
        }
      });

      // Initialize storage with default role
      localStorage.setItem("intended_role", roleInput.value);
    </script>
    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #718096; text-align: center; padding: 10px; background: #f4f7f6;">this was made by opedemowo olaoluwa victor</div>
</body>
</html>
