<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Management</title>
    <link rel="stylesheet" href="style.css" />
    
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="PaperBag &mdash; shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body class="account-page">
    <header class="account-header">
      <div
        class="header-content"
        style="
          display: flex;
          align-items: center;
          padding: 0 16px;
          height: 100%;
        "
      >
        <a
          href="account.html"
          style="color: var(--color-text); font-size: 20px; margin-right: 16px"
        >
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 style="font-size: 18px; font-weight: 600">Account Management</h1>
      </div>
    </header>

    <main class="account-container animate-fade-in" style="padding-top: 70px">
      <div class="section-label">Personal Information</div>
      <section class="menu-list">
        <div
          class="menu-item"
          style="
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 16px;
          "
        >
          <span class="muted" style="font-size: 12px">Full Name</span>
          <span id="mgmtName" style="font-weight: 500">Loading...</span>
        </div>
        <div
          class="menu-item"
          style="
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 16px;
          "
        >
          <span class="muted" style="font-size: 12px">Email Address</span>
          <span id="mgmtEmail" style="font-weight: 500">Loading...</span>
        </div>
      </section>

      <div class="section-label">Security</div>
      <section class="menu-list">
        <a href="reset-password.html" class="menu-item">
          <div class="menu-label">
            <span>Change Password</span>
          </div>
          <i class="fas fa-chevron-right"></i>
        </a>
        <a href="#" class="menu-item">
          <div class="menu-label">
            <span>Change Email</span>
          </div>
          <i class="fas fa-chevron-right"></i>
        </a>
      </section>

      <div class="section-label">Account Options</div>
      <section class="menu-list">
        <a href="close-account.html" class="menu-item" style="color: #ff4444">
          <div class="menu-label">
            <span>Delete Account</span>
          </div>
          <i class="fas fa-chevron-right"></i>
        </a>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="catalogue.html" class="nav-item">
        <i class="fas fa-list-ul"></i>
        <span>Catalogue</span>
      </a>
      <a href="cart.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
      </a>
      <a href="wishlist.html" class="nav-item">
        <i class="far fa-heart"></i>
        <span>Wishlist</span>
      </a>
      <a href="account.html" class="nav-item active">
        <i class="fas fa-user"></i>
        <span>Account</span>
      </a>
    </nav>

        <script type="module">
      import { auth } from "./firebase-config.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

      const nameEl = document.getElementById("mgmtName");
      const emailEl = document.getElementById("mgmtEmail");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          nameEl.textContent = user.displayName || user.email.split("@")[0];
          emailEl.textContent = user.email;
        } else {
          window.location.href = "login.html";
        }
      });
    </script>
  <script type="module" src="auth-state.js"></script>

<script src="dark-mode.js" defer></script>
</body>
</html>
