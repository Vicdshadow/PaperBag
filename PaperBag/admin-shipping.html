<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipping Settings Admin</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #111116;
        --admin-dark: #111116;
        --admin-bg: #ffffff;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }
      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
      }
      .sidebar-logo img {
        height: 32px;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
      }
      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #9a9aa2;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 14px;
        transition: 0.3s;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        color: var(--admin-accent);
        background: rgba(255, 102, 0, 0.1);
      }
      .settings-card {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        max-width: 500px;
      }
      .form-group {
        margin-bottom: 24px;
      }
      .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 14px;
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e6e6ea;
        border-radius: 10px;
        font-size: 16px;
      }
      .btn {
        padding: 12px 24px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: 0.3s;
      }
      .btn-primary {
        background: var(--admin-accent);
        color: white;
        width: 100%;
        margin-bottom: 12px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid #e6e6ea;
        width: 100%;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="PaperBag &mdash; shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        

        <nav class="sidebar-nav">
          <button class="tab-btn" onclick="window.location.href = 'admin.html'">
            <i class="fas fa-chart-line"></i> <span>Overview</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-sales.html'"
          >
            <i class="fas fa-exchange-alt"></i> <span>Sales Queue</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-users.html'"
          >
            <i class="fas fa-users-cog"></i> <span>User Management</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-inventory.html'"
          >
            <i class="fas fa-boxes"></i> <span>Inventory</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-upload.html'"
          >
            <i class="fas fa-upload"></i> <span>Upload Product</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-reviews.html'"
          >
            <i class="fas fa-star-half-alt"></i> <span>Reviews & Reports</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-chats.html'"
          >
            <i class="fas fa-comments"></i> <span>Chat Management</span>
          </button>
          <button
            class="tab-btn active"
            onclick="window.location.href = 'admin-shipping.html'"
          >
            <i class="fas fa-truck-loading"></i> <span>Shipping Settings</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-vouchers.html'"
          >
            <i class="fas fa-ticket-alt"></i> <span>Vouchers</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-super.html'"
          >
            <i class="fas fa-bolt" style="color: #f97066"></i>
            <span style="color: #f97066; font-weight: 600">Super Admin</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-subadmins.html'"
          >
            <i class="fas fa-user-shield"></i> <span>Sub-Admins</span>
          </button>
        </nav>

        <div style="margin-top: auto; padding-top: 20px">
          <button
            id="logoutBtn"
            class="btn-mini btn-outline"
            style="
              width: 100%;
              border-color: rgba(255, 255, 255, 0.2);
              color: white;
            "
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <h1>Global Shipping Settings</h1>
        <p class="muted">Set the default shipping fee for all orders.</p>

        <div class="settings-card">
          <form id="shippingForm">
            <div class="form-group">
              <label>Shipping Fee (?)</label>
              <input
                type="number"
                id="shippingFee"
                required
                placeholder="e.g. 1500"
                min="0"
              />
            </div>
            <button type="submit" class="btn btn-primary" id="saveBtn">
              Save Shipping Fee
            </button>
            <button type="button" class="btn btn-outline" id="freeBtn">
              Set to Free Shipping
            </button>
          </form>
          <div
            id="statusMsg"
            style="margin-top: 15px; font-size: 13px; text-align: center"
          ></div>
        </div>
      </main>
    </div>

    <script type="module">
      import {
        auth,
        db,
        doc,
        getDoc,
        setDoc,
        onAuthStateChanged,
        SELLER_EMAIL,
        isAdminEmail,
      } from "./firebase-config.js";

      const shippingInput = document.getElementById("shippingFee");
      const statusMsg = document.getElementById("statusMsg");

      async function requireAdmin(user) {
        if (!user) {
          window.location.href = "login.html";
          return false;
        }

        const isMasterAdmin = isAdminEmail(user.email);

        try {
          const snap = await getDoc(doc(db, "users", user.uid));
          const userData = snap.data();
          if (!isMasterAdmin && userData?.role !== "admin") {
            window.location.href = "index.html";
            return false;
          }
          return true;
        } catch (err) {
          console.error("Admin check failed:", err);
          if (isMasterAdmin) return true;
          window.location.href = "index.html";
          return false;
        }
      }

      onAuthStateChanged(auth, async (user) => {
        if (await requireAdmin(user)) {
          // ? SUB-ADMIN SIDEBAR HIDING
          const snap = await getDoc(doc(db, "users", user.uid));
          const userData = snap.data();
          if (userData?.role === "sub-admin") {
            document.querySelectorAll(".tab-btn").forEach((btn) => {
              const text = btn.textContent.toLowerCase();
              if (
                !text.includes("chats") &&
                !text.includes("overview") &&
                !text.includes("reports")
              ) {
                btn.style.display = "none";
              }
            });
            // Shipping is restricted for sub-admins
            alert("Access restricted.");
            window.location.href = "admin-chats.html";
            return;
          }

          loadCurrentFee();
        }
      });

      async function loadCurrentFee() {
        try {
          const docSnap = await getDoc(doc(db, "settings", "shipping"));
          if (docSnap.exists()) {
            shippingInput.value = docSnap.data().fee || 0;
          }
        } catch (err) {
          console.error("Error loading fee:", err);
        }
      }

      document
        .getElementById("shippingForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fee = parseInt(shippingInput.value);
          saveFee(fee);
        });

      document.getElementById("freeBtn").addEventListener("click", () => {
        shippingInput.value = 0;
        saveFee(0);
      });

      async function saveFee(fee) {
        statusMsg.style.color = "blue";
        statusMsg.textContent = "Saving...";
        try {
          await setDoc(
            doc(db, "settings", "shipping"),
            {
              fee: fee,
              updatedAt: new Date().toISOString(),
            },
            { merge: true },
          );
          statusMsg.style.color = "green";
          statusMsg.textContent = "Successfully updated!";
          setTimeout(() => (statusMsg.textContent = ""), 3000);
        } catch (err) {
          statusMsg.style.color = "red";
          statusMsg.textContent = "Error saving: " + err.message;
        }
      }
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js").then(
            ({ signOut }) => signOut(auth),
          );
        });
      }
    </script>
    <script type="module" src="auth-state.js"></script>
