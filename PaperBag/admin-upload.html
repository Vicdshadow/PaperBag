    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #111116;
        --admin-dark: #111116;
        --admin-bg: #ffffff;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        padding: 0 10px;
      }
      .sidebar-logo img {
        height: 32px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
        color: white;
      }

      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #9a9aa2;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-nav button i {
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 102, 0, 0.1);
        color: var(--admin-accent);
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-family: "Fraunces", serif;
        font-size: 28px;
        color: var(--admin-dark);
        margin: 0;
      }

      .section-card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
      }
      .section-card h2 {
        font-family: "Fraunces", serif;
        font-size: 20px;
        margin-bottom: 24px;
        color: var(--admin-dark);
        border-left: 4px solid var(--admin-accent);
        padding-left: 15px;
      }

      .admin-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: #9a9aa2;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .admin-table tbody tr {
        background: white;
        transition: 0.2s;
      }
      .admin-table tbody tr:hover {
        background: #f8f8fa;
      }
      .admin-table td {
        padding: 16px;
        border-bottom: 1px solid #f1f1f4;
        font-size: 14px;
        color: #33333b;
      }

      .btn-mini {
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        border: none;
      }
      .btn-primary {

        color: white;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid #e6e6ea;
        color: #33333b;

      .btn-outline:hover {
        background: #f8f8fa;
        border-color: #d4d4da;
      }

      /* Voucher Form Specifics */
      .voucher-form {
        display: grid;
        gap: 20px;

      }
      .form-group {

        flex-direction: column;

      .form-group label {

        font-weight: 600;

      }
      .form-group input,

        padding: 12px;
        border: 1px solid #e6e6ea;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
      }

      .form-group select:focus {
        outline: none;
        border-color: var(--admin-accent);
        box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);

        color: #319795;
      }

        background: #fff5f5;
        color: #b42318;
      }

    <script type="module">
      import {
        db,
        collection,
        addDoc,
        doc,
        getDoc,
        serverTimestamp,
        auth,
        onAuthStateChanged,
        storage,
        ref,
        uploadBytes,
        getDownloadURL,
        isAdminEmail,
      } from "./firebase-config.js";
      import {
        addLocalProduct,
        setProductSourceMode,
        PRODUCT_SOURCE,
      } from "./display-products.js";

      // -- Auto-Categorization Logic --
      const KEYWORD_MAP = {
        "electronics|Smartphones & Feature Phones": [
          "phone",
          "samsung",
          "iphone",
          "galaxy",
          "android",
        ],
        "electronics|Consoles & Games": ["ps5", "xbox", "gaming", "nintendo"],
        "home-appliances|Refrigerators & Freezers": [
          "fridge",
          "freezer",
          "refrigerator",
        ],
        "home-appliances|Washing Machines": ["washing machine", "washer"],
        "home-appliances|Microwaves & Ovens": ["microwave", "oven"],
        "it|Laptops & Desktops": ["laptop", "desktop", "macbook", "hp", "dell"],
        "power|Solar Panels": ["solar", "panel"],
        "power|Inverters": ["inverter"],
        "spare-parts": ["part", "spare", "component"],
        fashion: ["cloth", "shirt", "pant", "shoe", "bag"],
        perfume: ["perfume", "fragrance", "scent"],
        bicycles: ["bike", "bicycle", "cycle"],
      };

      const titleInput = document.getElementById("prodTitle");
      const descInput = document.getElementById("prodDesc");
      const catSelect = document.getElementById("prodCategory");

      function autoCategorize() {
        const descText = (descInput.value || "").toLowerCase();
        const titleText = (titleInput.value || "").toLowerCase();
        const text = descText || titleText;
        for (const [cat, keywords] of Object.entries(KEYWORD_MAP)) {
          if (keywords.some((kw) => text.includes(kw))) {
            catSelect.value = cat;
            break;
          }
        }
      }

      titleInput.addEventListener("input", autoCategorize);
      descInput.addEventListener("input", autoCategorize);

      // -- Image Preview and Base64 Logic --
      const imageFileInput = document.getElementById("prodImageFile");
      const previewContainer = document.getElementById("imagePreviewContainer");
      const previewImg = document.getElementById("imagePreview");

      async function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
          reader.readAsDataURL(file);
        });
      }

      imageFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const base64 = await fileToBase64(file);
            previewImg.src = base64;
            previewContainer.style.display = "block";
          } catch (err) {
            console.error("Error generating preview:", err);
          }
        } else {
          previewContainer.style.display = "none";
        }
      });

      let currentUser = null;
      let isAdminUser = false;

      async function resolveAdminAccess(user) {
        if (!user) return false;
        if (isAdminEmail(user.email)) {
          return true;
        }
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          const role = userSnap.data()?.role;
          return role === "admin" || role === "sub-admin";
        } catch (error) {
          console.error("Admin role check failed:", error);
          return false;
        }
      }

      onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        isAdminUser = await resolveAdminAccess(user);
        if (!isAdminUser) {
          alert("Admin access only.");
          window.location.href = "index.html";
        }
      });

      document
        .getElementById("uploadProductForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!currentUser || !isAdminUser) {
            return alert("You must be logged in as an Admin.");
          }

          const btn = e.target.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Publishing...`;
          btn.disabled = true;

          const title = document.getElementById("prodTitle").value.trim();
          const price = parseFloat(document.getElementById("prodPrice").value);
          let category = document.getElementById("prodCategory").value;
          const condition = document.getElementById("prodCondition").value;
          const description = document.getElementById("prodDesc").value.trim();
          const imageFile = document.getElementById("prodImageFile").files[0];

          if (!category) {
            autoCategorize();
            category = document.getElementById("prodCategory").value;
          }

          if (!condition) {
            alert("Please select product condition.");
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
          }

          if (!category) {
            alert(
              "Please select a catalogue or provide a clearer description.",
            );
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
          }

          if (!imageFile) {
            alert("Please select an image.");
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
          }

          const mainCat = category.includes("|")
            ? category.split("|")[0]
            : category;
          const subCat = category.includes("|") ? category.split("|")[1] : "";

          try {
            const base64Image = await fileToBase64(imageFile);
            const localId = `local-${Date.now()}`;

            // ALWAYS save to local storage first as a performance/offline backup
            addLocalProduct({
              id: localId,
              name: title,
              price,
              category: mainCat,
              subCategory: subCat,
              condition,
              description,
              image: base64Image,
              imageUrl: base64Image,
              stock: 10,
            });
            setProductSourceMode(PRODUCT_SOURCE.LOCAL);

            console.log("Product saved to local storage backup.");

            // Now attempt Firebase upload
            const ext = imageFile.name.split(".").pop() || "jpg";
            const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const imageRef = ref(
              storage,
              `products/${currentUser.uid}/${fileName}`,
            );

            await uploadBytes(imageRef, imageFile);
            const imageUrl = await getDownloadURL(imageRef);

            await addDoc(collection(db, "products"), {
              name: title,
              price,
              category: mainCat,
              subCategory: subCat,
              condition,
              description,
              imageUrl,
              image: imageUrl,
              soldOut: false,
              stock: 10,
              status: "active",
              sellerId: currentUser.uid,
              sellerEmail: currentUser.email || "",
              createdAt: serverTimestamp(),
            });

            alert(
              "Success! Product is live and synced to Firebase. A local backup was also created.",
            );
            e.target.reset();
            previewContainer.style.display = "none";
          } catch (err) {
            console.error("Firebase sync failed, but local copy exists:", err);
            alert(
              "Product saved to local inventory. (Firebase sync pending or failed: " +
                err.message +
                ")",
            );
            e.target.reset();
            previewContainer.style.display = "none";
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        });
    </script>
