<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vouchers Admin</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      :root {
        --admin-sidebar-w: 240px;
        --admin-accent: #111116;
        --admin-dark: #111116;
        --admin-bg: #ffffff;
      }
      body {
        background: var(--admin-bg);
        font-family: "Inter", sans-serif;
        margin: 0;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: var(--admin-sidebar-w);
        background: var(--admin-dark);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 1000;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        margin-right: -10px;
        padding-right: 10px;
      }
      .sidebar-nav::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .admin-main {
        flex: 1;
        margin-left: var(--admin-sidebar-w);
        padding: 40px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        padding: 0 10px;
      }
      .sidebar-logo img {
        height: 32px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .sidebar-logo span {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
        color: white;
      }

      .sidebar-nav button {
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        background: none;
        border: none;
        color: #9a9aa2;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-nav button i {
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      .sidebar-nav button:hover,
      .sidebar-nav button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar-nav button.active {
        border-left: 3px solid var(--admin-accent);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 102, 0, 0.1);
        color: var(--admin-accent);
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }
      .admin-header h1 {
        font-family: "Fraunces", serif;
        font-size: 28px;
        color: var(--admin-dark);
        margin: 0;
      }

      .section-card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
      }
      .section-card h2 {
        font-family: "Fraunces", serif;
        font-size: 20px;
        margin-bottom: 24px;
        color: var(--admin-dark);
        border-left: 4px solid var(--admin-accent);
        padding-left: 15px;
      }

      .admin-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: #9a9aa2;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .admin-table tbody tr {
        background: white;
        transition: 0.2s;
      }
      .admin-table tbody tr:hover {
        background: #f8f8fa;
      }
      .admin-table td {
        padding: 16px;
        border-bottom: 1px solid #f1f1f4;
        font-size: 14px;
        color: #33333b;
      }

      .btn-mini {
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        border: none;
      }
      .btn-primary {
        background: var(--admin-accent);
        color: white;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid #e6e6ea;
        color: #33333b;
      }
      .btn-outline:hover {
        background: #f8f8fa;
        border-color: #d4d4da;
      }

      /* Voucher Form Specifics */
      .voucher-form {
        display: grid;
        gap: 20px;
        max-width: 500px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: #33333b;
      }
      .form-group input,
      .form-group select {
        padding: 12px;
        border: 1px solid #e6e6ea;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--admin-accent);
        box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
      }
      .status-pill {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .status-active {
        background: #e6fffa;
        color: #319795;
      }
      .status-expired {
        background: #fff5f5;
        color: #b42318;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="PaperBag &mdash; shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        

        <nav class="sidebar-nav">
          <button class="tab-btn" onclick="window.location.href = 'admin.html'">
            <i class="fas fa-chart-line"></i> <span>Overview</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-sales.html'"
          >
            <i class="fas fa-exchange-alt"></i> <span>Sales Queue</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-users.html'"
          >
            <i class="fas fa-users-cog"></i> <span>User Management</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-inventory.html'"
          >
            <i class="fas fa-boxes"></i> <span>Inventory</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-upload.html'"
          >
            <i class="fas fa-upload"></i> <span>Upload Product</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-reviews.html'"
          >
            <i class="fas fa-star-half-alt"></i> <span>Reviews & Reports</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-chats.html'"
          >
            <i class="fas fa-comments"></i> <span>Chat Management</span>
          </button>
          <button
            class="tab-btn active"
            onclick="window.location.href = 'admin-vouchers.html'"
          >
            <i class="fas fa-ticket-alt"></i> <span>Vouchers</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-super.html'"
          >
            <i class="fas fa-bolt" style="color: #f97066"></i>
            <span style="color: #f97066; font-weight: 600">Super Admin</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-subadmins.html'"
          >
            <i class="fas fa-user-shield"></i> <span>Sub-Admins</span>
          </button>
          <button
            class="tab-btn"
            onclick="window.location.href = 'admin-shipping.html'"
          >
            <i class="fas fa-truck-loading"></i> <span>Shipping Settings</span>
          </button>
        </nav>

        <div style="margin-top: auto; padding-top: 20px">
          <button
            id="logoutBtn"
            class="btn-mini btn-outline"
            style="
              width: 100%;
              border-color: rgba(255, 255, 255, 0.2);
              color: white;
            "
          >
            <i class="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div>
            <h1>Voucher Management</h1>
            <p
              id="adminEmail"
              class="muted"
              style="font-size: 13px; margin-top: 5px"
            ></p>
          </div>
        </header>

        <section id="voucherSection" class="tab-content">
          <div
            class="stats-grid"
            style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px"
          >
            <!-- Form Generator -->
            <div class="section-card">
              <h2>Generate Voucher</h2>
              <form id="generateVoucherForm" class="voucher-form">
                <div class="form-group">
                  <label for="voucherCode">Voucher Code</label>
                  <div style="display: flex; gap: 8px">
                    <input
                      type="text"
                      id="voucherCode"
                      placeholder="e.g. SUMMER24"
                      required
                      style="flex: 1; text-transform: uppercase"
                    />
                    <button
                      type="button"
                      class="btn-mini btn-outline"
                      id="autoGenerateBtn"
                    >
                      <i class="fas fa-random"></i>
                    </button>
                  </div>
                </div>

                <div class="form-group">
                  <label for="discountType">Discount Type</label>
                  <select id="discountType" required>
                    <option value="percentage">Percentage (%)</option>
                    <option value="fixed">Fixed Amount (?)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label id="discountValueLabel" for="discountValue"
                    >Discount Value (%)</label
                  >
                  <input
                    type="number"
                    id="discountValue"
                    min="1"
                    step="0.01"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="assignToEmail"
                    >Assign to Specific User (Optional)</label
                  >
                  <input
                    type="email"
                    id="assignToEmail"
                    placeholder="user@example.com"
                  />
                  <small class="muted" style="font-size: 11px"
                    >If left blank, anyone can use it.</small
                  >
                </div>

                <button
                  type="submit"
                  class="btn-mini btn-primary"
                  style="padding: 12px; font-size: 13px"
                >
                  Generate Voucher
                </button>
              </form>
            </div>

            <!-- List -->
            <div class="section-card">
              <h2>Active Vouchers</h2>
              <div class="table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Code</th>
                      <th>Value</th>
                      <th>Assigned To</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="adminVoucherList">
                    <tr>
                      <td colspan="5" class="muted">Loading vouchers...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="admin.js"></script>
    <script type="module" src="auth-state.js"></script>
    <script>
      // UI Helpers for the form
      document
        .getElementById("discountType")
        .addEventListener("change", (e) => {
          const label = document.getElementById("discountValueLabel");
          if (e.target.value === "percentage") {
            label.textContent = "Discount Value (%)";
          } else {
            label.textContent = "Discount Value (?)";
          }
        });

      document
        .getElementById("autoGenerateBtn")
        .addEventListener("click", () => {
          const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
          let result = "EKO-";
          for (let i = 0; i < 8; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          document.getElementById("voucherCode").value = result;
        });
    </script>

</body>
</html>
