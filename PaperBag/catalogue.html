    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />

  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">
          <a href="index.html">Shop</a>
          <a href="new-arrivals.html">New Arrivals</a>
          <a href="catalogue.html" class="active">Catalogue</a>
        </nav>
        
        <div class="nav-icons">
          <div class="search-container" id="searchContainer">
            <i class="fas fa-search" id="searchIcon"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search..."
            />
            <i class="fas fa-times-circle search-clear" id="clearSearch"></i>
          </div>
          <a href="account.html"><i class="far fa-user"></i></a>
          <a href="cart.html" class="cart-link">
            <i class="fas fa-shopping-bag"></i>
            <span id="cartCount" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="categories-page animate-fade-in">
      <div class="container">
        <div class="catalogue-hero">
          <h1>Browse Catalogue</h1>
          <p>Explore categories and shop directly from live listings.</p>
        </div>
        <div class="category-layout">
          <aside class="category-sidebar">
            <div class="category-sidebar-title">All Categories</div>
            <ul id="categoryNavList" class="category-nav"></ul>
          </aside>
          <section class="category-main" id="categorySections"></section>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container text-center">
        <div class="footer-bottom">
          &copy; 2024. All rights reserved.
        <div class="creator-credit" style="font-size: 10px; color: #55555e; margin-top: 5px;">this was made by opedemowo olaoluwa victor</div>
        </div>
      </div>
    </footer>

    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        getDocs,
        collection,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

      const cartCountEl = document.getElementById("cartCount");

      onAuthStateChanged(auth, async (user) => {
        updateCartCount(user);
      });

      async function updateCartCount(user) {
        if (!cartCountEl) return;
        let count = 0;
        if (user) {
          const snap = await getDocs(collection(db, "users", user.uid, "cart"));
          count = snap.docs.reduce((n, d) => n + (d.data().qty || 0), 0);
        } else {
          const guestCart = JSON.parse(
            localStorage.getItem("guest_cart") || "[]",
          );
          count = guestCart.reduce((n, i) => n + (i.qty || 0), 0);
        }
        cartCountEl.textContent = count;
        cartCountEl.style.display = count > 0 ? "flex" : "none";
      }
    </script>
    <script type="module" src="categories.js"></script>
