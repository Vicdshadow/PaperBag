<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homes | Real Estate</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      .est-hero {
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url("assets/images/remote/remote-c7bdcf9406.jpg");
        background-size: cover;
        background-position: center;
        color: white;
        padding: 120px 20px;
        text-align: center;
        margin-bottom: 40px;
      }
      .est-hero h1 {
        font-size: 3rem;
        margin-bottom: 15px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      .prop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        padding-bottom: 60px;
      }
      .prop-card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #f8f8fa;
        transition: box-shadow 0.3s ease;
      }
      .prop-card:hover {
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }
      .prop-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }
      .prop-details {
        padding: 24px;
      }
      .prop-type {
        text-transform: uppercase;
        font-size: 10px;
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: 1px;
      }
      .prop-title {
        font-size: 1.2rem;
        margin: 5px 0 10px;
        font-weight: 600;
        color: #222;
      }
      .prop-price {
        font-size: 1.4rem;
        font-weight: 700;
        color: #1c1c22;
        margin-bottom: 15px;
      }
      .prop-features {
        display: flex;
        gap: 15px;
        color: #55555e;
        font-size: 0.9rem;
        border-top: 1px solid #f8f8fa;
        padding-top: 15px;
      }
    </style>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta
      name="description"
      content=" â€” shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery."
    />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        <nav class="nav-links mobile-hidden">
          <a href="index.html">Main Shop</a>
          <a href="Autos.html">Autos</a>
          <a href="Air B&B.html">Stays</a>
        </nav>

        <div class="nav-icons">
          <a href="account.html"><i class="far fa-user"></i></a>
        </div>
      </div>
    </header>

    <div class="est-hero animate-fade-in">
      <h1>Find Your Perfect Space</h1>
      <p>Luxury apartments, lands, and premium homes in Lagos & beyond.</p>
      <a
        href="upload-services.html"
        class="btn btn-primary seller-only hidden"
        style="margin-top: 20px"
        >List Property</a
      >
    </div>

    <main class="container">
      <div id="propGrid" class="prop-grid">
        <!-- Property cards will be injected here by services.js -->
      </div>
    </main>

    <script type="module" src="services.js"></script>
    <script type="module" src="auth-state.js"></script>

    <div
      class="creator-credit"
      style="
        font-size: 10px;
        color: #55555e;
        text-align: center;
        padding: 10px;
        background: #ffffff;
      "
    >
      this was made by opedemowo olaoluwa victor
    </div>
    <script src="compliance.js" defer></script>
    <script type="module" src="wishlist.js"></script>
    <script type="module" src="assistant.js"></script>
<script src="dark-mode.js" defer></script>
</body>
</html>
