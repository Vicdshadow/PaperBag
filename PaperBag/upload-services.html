<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Service Listings</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
      .upload-page {
        padding: 40px 0;
        max-width: 800px;
        margin: 0 auto;
      }
      .upload-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .form-section {
        display: none; /* Hidden by default */
      }
      .form-section.active {
        display: block;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #e6e6ea;
        border-radius: 8px;
        font-family: inherit;
      }
      .image-upload-area {
        border: 2px dashed #e6e6ea;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
      }
      .image-upload-area:hover {
        border-color: var(--color-primary);
        background: #fff9f5;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="PaperBag &mdash; shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <header class="site-header glass">
      <div class="container header-inner">
        
        <nav class="nav-links">
          <a href="upload-services.html" class="active">Upload Listing</a>
        </nav>
      </div>
    </header>

    <main class="container upload-page animate-fade-in">
      <div class="upload-container">
        <h1 class="section-title">Create New Listing</h1>
        <p class="muted" style="margin-bottom: 30px">
          Select the vertical you want to upload to.
        </p>

        <div class="form-group">
          <label for="verticalSelect">Listing Category</label>
          <select id="verticalSelect" onchange="toggleForm()">
            <option value="">-- Select Category --</option>
            <option value="autos"> Autos (Cars)</option>
            <option value="realestate"> Real Estate (Properties)</option>
            <option value="stay"> Stay (Shortlets/Hotels)</option>
          </select>
        </div>

        <form id="uploadForm">
          <!-- Common Fields -->
          <div class="form-group">
            <label>Title / Name</label>
            <input type="text" placeholder="e.g. 2021 Toyota Camry" required />
          </div>

          <div class="form-group">
            <label>Price (₦)</label>
            <input type="number" placeholder="0.00" required />
          </div>

          <!-- Autos Specific -->
          <div id="autosFields" class="form-section">
            <div class="form-group">
              <label>Car Make</label>
              <select id="autosMake" required>
                <option value="">Select Make</option>
                <option value="toyota">Toyota</option>
                <option value="honda">Honda</option>
                <option value="mercedes-benz">Mercedes-Benz</option>
                <option value="lexus">Lexus</option>
                <option value="nissan">Nissan</option>
                <option value="hyundai">Hyundai</option>
                <option value="kia">Kia</option>
                <option value="ford">Ford</option>
                <option value="mitsubishi">Mitsubishi</option>
                <option value="volkswagen">Volkswagen</option>
                <option value="peugeot">Peugeot</option>
                <option value="land-rover">Land Rover</option>
                <option value="jeep">Jeep</option>
                <option value="bmw">BMW</option>
                <option value="audi">Audi</option>
                <option value="mazda">Mazda</option>
                <option value="suzuki">Suzuki</option>
                <option value="innoson">Innoson</option>
                <option value="nord">Nord</option>
                <option value="infiniti">Infiniti</option>
                <option value="volvo">Volvo</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px"
            >
              <div class="form-group">
                <label>Distance (Miles/KM)</label>
                <input type="number" placeholder="Mileage" required />
              </div>
              <div class="form-group">
                <label>Year</label>
                <input type="number" placeholder="2024" required />
              </div>
            </div>
            <div class="form-group">
              <label>Transmission</label>
              <select required>
                <option>Automatic</option>
                <option>Manual</option>
              </select>
            </div>
          </div>

          <!-- Real Estate Specific -->
          <div id="realestateFields" class="form-section">
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px"
            >
              <div class="form-group">
                <label>Bedrooms</label>
                <input type="number" placeholder="4" />
              </div>
              <div class="form-group">
                <label>Bathrooms</label>
                <input type="number" placeholder="5" />
              </div>
            </div>
            <div class="form-group">
              <label>Property Type</label>
              <select>
                <option>For Sale</option>
                <option>For Rent</option>
                <option>Land</option>
              </select>
            </div>
          </div>

          <!-- Stay Specific -->
          <div id="stayFields" class="form-section">
            <div class="form-group">
              <label>Price Per</label>
              <select>
                <option>Night</option>
                <option>Week</option>
                <option>Month</option>
              </select>
            </div>
            <div class="form-group">
              <label>Max Guests</label>
              <input type="number" placeholder="2" />
            </div>
            <div class="form-group">
              <label>Amenities (comma separated)</label>
              <input type="text" placeholder="WiFi, Pool, Gym" />
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea rows="5" placeholder="Detailed description..."></textarea>
          </div>

          <div class="form-group">
            <label>Images</label>
            <div class="image-upload-area">
              <i
                class="fas fa-cloud-upload-alt"
                style="font-size: 30px; color: #ccc; margin-bottom: 10px"
              ></i>
              <p>
                Click to upload or drag and drop<br /><span
                  class="muted"
                  style="font-size: 12px"
                  >JPG, PNG up to 5MB</span
                >
              </p>
              <input
                type="file"
                multiple
                style="display: none"
                id="fileInput"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%">
            Publish Listing
          </button>
        </form>
      </div>
    </main>

    <script type="module">
      import {
        auth,
        db,
        addDoc,
        collection,
        serverTimestamp,
        onAuthStateChanged,
      } from "./firebase-config.js";

      let currentUser = null;
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (!user) {
          alert("Please login as a seller to post listings.");
          window.location.href = "login.html";
        }
      });

      window.toggleForm = function () {
        // Hide all specific sections
        document
          .querySelectorAll(".form-section")
          .forEach((el) => el.classList.remove("active"));

        const selection = document.getElementById("verticalSelect").value;
        if (selection === "autos") {
          document.getElementById("autosFields").classList.add("active");
        } else if (selection === "realestate") {
          document.getElementById("realestateFields").classList.add("active");
        } else if (selection === "stay") {
          document.getElementById("stayFields").classList.add("active");
        }
      };

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          if (!currentUser) {
            alert("You must be logged in to post.");
            return;
          }

          const vertical = document.getElementById("verticalSelect").value;
          if (!vertical) {
            alert("Please select a listing category.");
            return;
          }

          const btn = e.target.querySelector('button[type="submit"]');
          const originalText = btn.textContent;
          btn.textContent = "Publishing...";
          btn.disabled = true;

          const title = e.target.querySelector(
            'input[placeholder="e.g. 2021 Toyota Camry"]',
          ).value;
          const price = parseFloat(
            e.target.querySelector('input[placeholder="0.00"]').value,
          );
          const description = e.target.querySelector("textarea").value;

          let meta = {};
          if (vertical === "autos") {
            meta = {
              make: e.target.querySelector("#autosMake").value,
              mileage: e.target.querySelector(
                '#autosFields input[placeholder="Mileage"]',
              ).value,
              year: e.target.querySelector(
                '#autosFields input[placeholder="2024"]',
              ).value,
              transmission: e.target.querySelector(
                "#autosFields select:not(#autosMake)",
              ).value,
            };
          } else if (vertical === "realestate") {
            meta = {
              bedrooms: e.target.querySelector(
                '#realestateFields input[placeholder="4"]',
              ).value,
              bathrooms: e.target.querySelector(
                '#realestateFields input[placeholder="5"]',
              ).value,
              type: e.target.querySelector("#realestateFields select").value,
            };
          } else if (vertical === "stay") {
            meta = {
              pricePer: e.target.querySelector("#stayFields select").value,
              maxGuests: e.target.querySelector(
                '#stayFields input[placeholder="2"]',
              ).value,
              amenities: e.target
                .querySelector(
                  '#stayFields input[placeholder="WiFi, Pool, Gym"]',
                )
                .value.split(",")
                .map((s) => s.trim()),
            };
          }

          try {
            // In a real app we would upload images here, but for now we'll use a placeholder
            const imageUrl =
              "assets/images/remote/remote-6a91458c6f.jpg";

            await addDoc(collection(db, "specialized_listings"), {
              vertical,
              title,
              price,
              description,
              meta,
              imageUrl,
              sellerEmail: currentUser.email,
              sellerId: currentUser.uid,
              createdAt: serverTimestamp(),
            });

            alert("✅ Listing published successfully!");
            e.target.reset();
            toggleForm();
          } catch (err) {
            console.error("Error publishing listing:", err);
            alert("❌ Failed to publish: " + err.message);
          } finally {
            btn.textContent = originalText;
            btn.disabled = false;
          }
        });

      // Simple file input trigger
      document
        .querySelector(".image-upload-area")
        .addEventListener("click", () => {
          document.getElementById("fileInput").click();
        });
    </script>
    <script type="module" src="auth-state.js"></script>

    <div class="creator-credit" style="font-size: 10px; color: #55555e; text-align: center; padding: 10px; background: #ffffff;">this was made by opedemowo olaoluwa victor</div>
    <script src="compliance.js" defer></script>  <script type="module" src="wishlist.js"></script>
    <script type="module" src="assistant.js"></script>
<script src="dark-mode.js" defer></script>
</body>
</html>
