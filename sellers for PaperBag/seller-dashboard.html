<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Dashboard</title>
    
    <style>
:root {
        --bg-1: #ffffff;
        --bg-2: #f8f8fa;
        --ink: #111116;
        --ink-soft: #55555e;
        --gold: #111116;
        --gold-deep: #000000;
        --line: #e6e6ea;
        --card-bg: #ffffff;
        --danger: #b42318;
        --primary: #000000;
        --border: #e6e6ea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background:
          radial-gradient(circle at 8% 14%, rgba(185, 146, 90, 0.35), transparent 40%),
          radial-gradient(circle at 88% 88%, rgba(50, 40, 31, 0.16), transparent 38%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--ink);
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding: 1.15rem 1.4rem;
        border: 1px solid rgba(255, 255, 255, 0.66);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.66);
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 30px rgba(29, 24, 19, 0.1);
      }
      .header h1 {
        margin: 0;
        font-family: "Fraunces", serif;
        font-size: 2rem;
        color: #241f18;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .home-link {
        color: #6f6254;
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.85rem;
      }
      .home-link:hover {
        color: var(--gold-deep);
      }
      .logout-btn {
        background: #fffdfa;
        border: 1px solid #d9cdbd;
        color: #4d4337;
        padding: 0.5rem 0.9rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 600;
      }
      .logout-btn:hover {
        border-color: #bfa179;
        color: var(--gold-deep);
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 1.4rem;
        align-items: start;
      }
      @media (max-width: 768px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .container {
          padding: 1rem;
        }
        .header {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.8rem;
        }
      }
      .card {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 1rem;
        padding: 1.35rem;
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 16px 34px rgba(29, 24, 19, 0.09);
        position: sticky;
        top: 1rem;
        backdrop-filter: blur(8px);
      }
      .card h2 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.35rem;
        font-family: "Fraunces", serif;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.65rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.35rem;
        font-weight: 600;
        font-size: 0.77rem;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: #4a4035;
      }
      .form-input {
        width: 100%;
        padding: 0.68rem;
        border: 1.5px solid #d8cbbb;
        border-radius: 0.55rem;
        background: #fffdfa;
        color: #2f2922;
        font-family: inherit;
        font-size: 0.92rem;
        transition: border-color 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: #111116;
        box-shadow: 0 0 0 2px rgba(185, 146, 90, 0.15);
      }
      textarea.form-input {
        resize: vertical;
        min-height: 100px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #111116, #000000);
        color: #fffdf8;
        border: none;
        padding: 0.75rem 1.1rem;
        border-radius: 0.55rem;
        cursor: pointer;
        font-weight: 700;
        width: 100%;
        font-size: 0.95rem;
        transition: filter 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        box-shadow: 0 8px 24px rgba(143, 111, 63, 0.3);
      }
      .btn-primary:hover {
        filter: brightness(1.03);
      }
      .btn-primary:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .products-header {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.65rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "Fraunces", serif;
        color: #241f18;
      }
      .product-count-badge {
        background: #000000;
        color: #fffdf8;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        font-family: "Inter", sans-serif;
      }
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.1rem;
      }
      .product-card {
        background: var(--card-bg);
        border-radius: 0.85rem;
        border: 1px solid #eadfce;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(29, 24, 19, 0.08);
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 26px rgba(29, 24, 19, 0.13);
      }
      .product-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-bottom: 1px solid #eadfce;
      }
      .product-details {
        padding: 1rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .product-title {
        margin: 0 0 0.35rem 0;
        font-size: 1rem;
        color: #2b241c;
        font-weight: 700;
      }
      .product-price {
        font-weight: 700;
        color: var(--gold-deep);
        margin: 0 0 0.4rem 0;
        font-size: 1.1rem;
      }
      .product-category {
        font-size: 0.72rem;
        color: #fff;
        background: #6f6254;
        padding: 2px 8px;
        border-radius: 999px;
        display: inline-block;
        margin-bottom: 0.65rem;
      }
      .product-desc {
        color: #6b5f53;
        font-size: 0.84rem;
        margin: 0 0 0.95rem 0;
        flex-grow: 1;
        line-height: 1.5;
      }
      .product-actions {
        display: flex;
        gap: 0.55rem;
        margin-top: auto;
      }
      .btn-action {
        flex: 1;
        padding: 0.52rem;
        border-radius: 0.4rem;
        border: none;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .btn-edit {
        background: #fffdfa;
        color: #4f4438;
        border: 1px solid #d8cbbb;
      }
      .btn-edit:hover {
        border-color: #bfa179;
        color: var(--gold-deep);
      }
      .btn-delete {
        background: #fff2ef;
        color: var(--danger);
        border: 1px solid #f4c2b8;
      }
      .btn-delete:hover {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
      }
      .progress-bar-wrap {
        width: 100%;
        background: #e5ddd1;
        border-radius: 999px;
        height: 6px;
        margin-top: 10px;
        display: none;
      }
      .progress-bar {
        height: 6px;
        border-radius: 999px;
        background: var(--gold-deep);
        width: 0%;
        transition: width 0.3s;
      }
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 1.05rem;
        font-weight: 600;
        z-index: 1000;
        gap: 0.9rem;
        color: var(--gold-deep);
      }
      .spinner {
        border: 4px solid rgba(185, 146, 90, 0.18);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border-left-color: var(--gold-deep);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(26, 20, 14, 0.55);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      .modal-box {
        background: #fffdf8;
        border-radius: 0.85rem;
        padding: 1.5rem;
        width: 100%;
        max-width: 420px;
        position: relative;
        border: 1px solid #eadfce;
        box-shadow: 0 20px 60px rgba(29, 24, 19, 0.3);
      }
      .modal-close {
        position: absolute;
        right: 12px;
        top: 8px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 1.5rem;
        color: #6b5f53;
        line-height: 1;
      }
      .modal-box h2 {
        margin-top: 0;
        font-family: "Fraunces", serif;
      }
      .hidden {
        display: none !important;
      }
      .status-msg {
        margin-top: 11px;
        font-size: 0.85rem;
        text-align: center;
        font-weight: 600;
        min-height: 1.2em;
      }
    </style>
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="theme-refinement.css" />
    <link rel="stylesheet" href="assistant.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="compliance.css" />
    <meta name="description" content="PaperBag &mdash; shop electronics, fashion, home goods and more with secure checkout, trusted sellers and nationwide delivery." />
    <meta name="theme-color" content="#111116" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <!-- Auth Loading Screen -->
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div>Verifying seller access...</div>
    </div>

    <!-- Main Dashboard -->
    <div class="container hidden" id="dashboard-content">
      <header class="header">
        <h1>
          <i
            class="fas fa-store"
            style="color: var(--primary); margin-right: 10px"
          ></i>
          Seller Dashboard
        </h1>
        <div class="header-right">
          <a
            href="seller-wallet.html"
            class="home-link"
            style="margin-right: 15px; color: #c2a15a"
          >
            <i class="fas fa-wallet"></i> Wallet & Payouts
          </a>
          <a href="index.html" class="home-link">
            <i class="fas fa-th-large"></i> Seller Portal
          </a>
          <button id="logout-btn" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Log Out
          </button>
        </div>
      </header>

      <div class="dashboard-grid">
        <!-- Upload Form -->
        <div class="card">
          <h2>
            <i
              class="fas fa-cloud-upload-alt"
              style="color: var(--primary)"
            ></i>
            Upload New Product
          </h2>
          <form id="product-form">
            <div class="form-group">
              <label for="product-name">Product Name *</label>
              <input
                type="text"
                id="product-name"
                class="form-input"
                required
                placeholder="e.g. Samsung Galaxy A55"
              />
            </div>

            <div class="form-group">
              <label for="product-price">Price (₦) *</label>
              <input
                type="number"
                id="product-price"
                class="form-input"
                required
                min="0"
                step="1"
                placeholder="e.g. 150000"
              />
            </div>

            <div class="form-group">
              <label for="product-category">Category</label>
              <select id="product-category" class="form-input">
                <option>Electronics</option>
                <option>Home Appliances</option>
                <option>Furniture</option>
                <option>Books</option>
                <option>Power</option>
                <option>Fashion</option>
                <option>Perfume</option>
                <option>Office</option>
                <option>IT Equipment</option>
                <option>Lighting</option>
                <option>Spare Parts</option>
                <option>Car Electronics</option>
                <option>Bicycles</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="product-desc">Description *</label>
              <textarea
                id="product-desc"
                class="form-input"
                required
                placeholder="Describe your product in detail..."
              ></textarea>
            </div>

            <div class="form-group">
              <label for="product-condition">Condition *</label>
              <select id="product-condition" class="form-input" required>
                <option value="brand_new">Brand New</option>
                <option value="preowned">Preowned</option>
              </select>
            </div>

            <div class="form-group">
              <label for="product-image">Product Image *</label>
              <input
                type="file"
                id="product-image"
                class="form-input"
                accept="image/*"
                required
              />
              <div
                id="image-preview-wrap"
                style="margin-top: 10px; display: none"
              >
                <img loading="lazy" decoding="async"
                  id="image-preview"
                  src=""
                  alt="Preview"
                  style="
                    width: 100%;
                    max-height: 200px;
                    object-fit: contain;
                    border-radius: 0.5rem;
                    border: 1px solid var(--border);
                  "
                />
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">
              <i class="fas fa-cloud-upload-alt"></i> Upload Product
            </button>

            <!-- Upload progress -->
            <div class="progress-bar-wrap" id="progress-wrap">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="upload-status" class="status-msg"></div>
          </form>
        </div>

        <!-- Products List -->
        <div>
          <div class="products-header">
            <span
              >My Products
              <span id="product-count-badge" class="product-count-badge hidden"
                >0</span
              ></span
            >
          </div>
          <div id="products-container" class="products-grid">
            <!-- Products injected via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <button id="close-modal" class="modal-close" title="Close">
          &times;
        </button>
        <h2>
          <i class="fas fa-edit" style="color: var(--primary)"></i> Edit Product
        </h2>
        <form id="edit-form">
          <input type="hidden" id="edit-id" />
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="edit-name" class="form-input" required />
          </div>
          <div class="form-group">
            <label>Price (₦)</label>
            <input
              type="number"
              id="edit-price"
              class="form-input"
              required
              min="0"
            />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="edit-desc" class="form-input" required></textarea>
          </div>
          <button type="submit" class="btn-primary" id="save-edit-btn">
            <i class="fas fa-save"></i> Save Changes
          </button>
          <div id="edit-status" class="status-msg"></div>
        </form>
      </div>
    </div>

    <script type="module" src="./seller.js"></script>
      <script src="compliance.js" defer></script>
      <script type="module" src="assistant.js"></script>
<script src="dark-mode.js" defer></script>
</body>
</html>
