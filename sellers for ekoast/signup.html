<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Registration</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap");
      :root {
        --bg-1: #f8f3ea;
        --bg-2: #e8dcc8;
        --ink: #2f2a24;
        --ink-soft: #6e6355;
        --panel-dark-1: #1f1b17;
        --panel-dark-2: #32281f;
        --gold: #b9925a;
        --gold-deep: #8f6f3f;
        --line: #d9ccb9;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Manrope",
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at 8% 14%,
            rgba(185, 146, 90, 0.35),
            transparent 40%
          ),
          radial-gradient(
            circle at 88% 88%,
            rgba(50, 40, 31, 0.16),
            transparent 38%
          ),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        padding: 2rem 1rem;
        overflow-y: auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.76);
        border-radius: 1.3rem;
        width: 100%;
        max-width: 470px;
        border: 1px solid rgba(255, 255, 255, 0.66);
        box-shadow:
          0 30px 60px rgba(29, 24, 19, 0.18),
          0 1px 0 rgba(255, 255, 255, 0.7) inset;
        backdrop-filter: blur(12px);
        overflow: hidden;
        animation: floatIn 0.6s ease-out;
      }
      .card-inner {
        padding: 1.8rem 2rem;
      }
      .hero-area {
        background:
          linear-gradient(160deg, rgba(185, 146, 90, 0.08), transparent 42%),
          linear-gradient(155deg, var(--panel-dark-1), var(--panel-dark-2));
        padding: 1.35rem 1.3rem 0.9rem;
        text-align: center;
        border-bottom: 1px solid rgba(185, 146, 90, 0.22);
      }
      .hero-area svg {
        width: 100%;
        max-width: 255px;
        height: auto;
        opacity: 0.9;
      }
      .step-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 0.85rem;
      }
      .step-dot {
        width: 28px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.3);
      }
      .step-dot.active {
        background: #d9bf94;
      }
      .step-dot.filled {
        background: #b9925a;
        opacity: 0.5;
      }
      h2 {
        font-family: "Cormorant Garamond", serif;
        color: #221d17;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.22rem;
        text-align: center;
      }
      .form-subtitle {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.84rem;
        margin-bottom: 1.2rem;
      }
      .form-group {
        margin-bottom: 0.95rem;
      }
      label {
        display: block;
        color: #4a4035;
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        margin-bottom: 0.35rem;
      }
      .input-wrap {
        position: relative;
      }
      .input-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: #9f8f76;
        font-size: 0.85rem;
        pointer-events: none;
      }
      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 0.72rem 0.9rem 0.72rem 2.5rem;
        background: #fffdfa;
        border: 1.5px solid #d8cbbb;
        border-radius: 0.6rem;
        color: #2f2922;
        font-family: inherit;
        font-size: 0.93rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
      }
      input::placeholder {
        color: #a59681;
      }
      input:focus {
        border-color: #b9925a;
        box-shadow: 0 0 0 3px rgba(185, 146, 90, 0.16);
      }
      .toggle-password {
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #99876d;
        cursor: pointer;
        padding: 0;
        font-size: 0.85rem;
        transition: color 0.2s;
      }
      .toggle-password:hover {
        color: var(--gold-deep);
      }
      .strength-wrap {
        margin-top: 0.45rem;
      }
      .strength-bars {
        display: flex;
        gap: 4px;
        height: 3px;
        margin-bottom: 0.3rem;
      }
      .strength-bar {
        flex: 1;
        border-radius: 999px;
        background: #e5ddd1;
        transition: background 0.3s;
      }
      .strength-bar.weak {
        background: #ef4444;
      }
      .strength-bar.fair {
        background: #f59e0b;
      }
      .strength-bar.good {
        background: #3b82f6;
      }
      .strength-bar.strong {
        background: #22c55e;
      }
      .strength-text {
        font-size: 0.74rem;
        color: #7d6f5a;
      }
      .terms-wrap {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        margin-bottom: 1rem;
      }
      .terms-wrap input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        flex-shrink: 0;
        accent-color: #b9925a;
      }
      .terms-wrap label {
        color: #6e6254;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        margin: 0;
      }
      .terms-wrap a {
        color: var(--gold-deep);
        text-decoration: none;
      }
      .terms-wrap a:hover {
        text-decoration: underline;
      }
      .alert {
        padding: 0.7rem 0.9rem;
        border-radius: 0.6rem;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 1rem;
        display: none;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .alert.show {
        display: flex;
      }
      .alert-error {
        background: #fff2ef;
        border: 1px solid #f4c2b8;
        color: #b94a36;
      }
      .alert-success {
        background: #eff8f1;
        border: 1px solid #b8e4c4;
        color: #1b7a3a;
      }
      .btn-primary {
        width: 100%;
        padding: 0.82rem;
        background: linear-gradient(135deg, #b9925a, #8f6f3f);
        color: #fffdf8;
        border: none;
        border-radius: 0.6rem;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition:
          filter 0.2s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 8px 24px rgba(143, 111, 63, 0.34);
        margin-bottom: 1rem;
      }
      .btn-primary:hover {
        filter: brightness(1.03);
      }
      .btn-primary:active {
        transform: scale(0.99);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .bottom-link {
        text-align: center;
        color: #6f6458;
        font-size: 0.85rem;
      }
      .bottom-link a {
        color: var(--gold-deep);
        font-weight: 600;
        text-decoration: none;
      }
      .bottom-link a:hover {
        text-decoration: underline;
      }
      #success-view {
        display: none;
        text-align: center;
        padding: 0.9rem 0;
      }
      .success-icon {
        width: 72px;
        height: 72px;
        background: rgba(34, 197, 94, 0.15);
        border: 2px solid rgba(34, 197, 94, 0.4);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin-bottom: 1.2rem;
        color: #22c55e;
      }
      #success-view h2 {
        color: #221d17 !important;
        margin-bottom: 0.45rem;
      }
      #success-view p {
        color: #6a5f52;
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 1.4rem;
      }
      @media (max-width: 520px) {
        .card {
          max-width: 440px;
          border-radius: 1.15rem;
        }
        .card-inner {
          padding: 1.4rem 1.25rem;
        }
      }
      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <!-- ── Hero Illustration ── -->
      <div class="hero-area">
        <!-- Inline SVG: Jumia-style storefront illustration -->
        <svg
          viewBox="0 0 300 180"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Sky / background -->
          <rect width="300" height="180" fill="#fff8f0" />
          <!-- Ground -->
          <ellipse cx="150" cy="165" rx="130" ry="10" fill="#f0e0c8" />
          <!-- Store building -->
          <rect
            x="60"
            y="70"
            width="180"
            height="90"
            rx="4"
            fill="#ffffff"
            stroke="#e5d0b8"
            stroke-width="1.5"
          />
          <!-- Awning stripes -->
          <rect x="55" y="58" width="190" height="20" rx="3" fill="#ff6600" />
          <rect
            x="67"
            y="58"
            width="18"
            height="20"
            fill="#fff"
            opacity="0.5"
          />
          <rect
            x="101"
            y="58"
            width="18"
            height="20"
            fill="#fff"
            opacity="0.5"
          />
          <rect
            x="135"
            y="58"
            width="18"
            height="20"
            fill="#fff"
            opacity="0.5"
          />
          <rect
            x="169"
            y="58"
            width="18"
            height="20"
            fill="#fff"
            opacity="0.5"
          />
          <rect
            x="203"
            y="58"
            width="18"
            height="20"
            fill="#fff"
            opacity="0.5"
          />
          <!-- Store window left -->
          <rect
            x="72"
            y="84"
            width="52"
            height="40"
            rx="2"
            fill="#e8f4ff"
            stroke="#bdd7f0"
            stroke-width="1"
          />
          <!-- Shelf inside -->
          <rect x="74" y="100" width="48" height="2" fill="#bdd7f0" />
          <!-- Products on shelves -->
          <rect x="77" y="91" width="10" height="9" rx="1" fill="#ff9500" />
          <rect x="91" y="93" width="8" height="7" rx="1" fill="#0d9488" />
          <rect x="103" y="90" width="7" height="10" rx="1" fill="#f59e0b" />
          <rect x="77" y="104" width="10" height="8" rx="1" fill="#3b82f6" />
          <rect x="92" y="105" width="8" height="7" rx="1" fill="#ef4444" />
          <rect x="105" y="104" width="7" height="8" rx="1" fill="#8b5cf6" />
          <!-- Store sign above window -->
          <rect x="72" y="74" width="52" height="8" rx="1" fill="#ff6600" />
          <text
            x="98"
            y="81"
            font-size="5"
            fill="white"
            text-anchor="middle"
            font-family="Inter,sans-serif"
            font-weight="600"
          ></text>
          <!-- Door -->
          <rect
            x="132"
            y="110"
            width="36"
            height="50"
            rx="2"
            fill="#d1a87c"
            stroke="#b08040"
            stroke-width="1"
          />
          <circle cx="162" cy="136" r="2.5" fill="#b08040" />
          <!-- Star badge on door -->
          <circle cx="150" cy="125" r="9" fill="#ff6600" />
          <text x="150" y="129" font-size="9" fill="white" text-anchor="middle">
            ★
          </text>
          <!-- Seller figure -->
          <!-- body -->
          <rect x="198" y="100" width="26" height="35" rx="4" fill="#ff9500" />
          <!-- apron -->
          <rect
            x="202"
            y="105"
            width="18"
            height="25"
            rx="2"
            fill="#fff"
            opacity="0.8"
          />
          <!-- apron strings -->
          <line
            x1="202"
            y1="107"
            x2="198"
            y2="105"
            stroke="#ff9500"
            stroke-width="1"
          />
          <line
            x1="220"
            y1="107"
            x2="224"
            y2="105"
            stroke="#ff9500"
            stroke-width="1"
          />
          <!-- head -->
          <circle cx="211" cy="92" r="12" fill="#f5c5a0" />
          <!-- hair -->
          <ellipse cx="211" cy="82" rx="12" ry="5" fill="#3d1f00" />
          <!-- eyes -->
          <circle cx="207" cy="92" r="1.5" fill="#3d1f00" />
          <circle cx="215" cy="92" r="1.5" fill="#3d1f00" />
          <!-- smile -->
          <path
            d="M207 97 Q211 101 215 97"
            stroke="#3d1f00"
            stroke-width="1.2"
            fill="none"
            stroke-linecap="round"
          />
          <!-- waving arm -->
          <path
            d="M224 108 Q235 98 228 90"
            stroke="#f5c5a0"
            stroke-width="5"
            stroke-linecap="round"
            fill="none"
          />
          <!-- legs -->
          <rect x="200" y="133" width="9" height="22" rx="3" fill="#2d3748" />
          <rect x="213" y="133" width="9" height="22" rx="3" fill="#2d3748" />
          <!-- pot plant left -->
          <ellipse cx="72" cy="155" rx="12" ry="5" fill="#c8a87a" />
          <rect x="62" y="140" width="20" height="15" rx="3" fill="#d4a96a" />
          <circle cx="69" cy="134" r="7" fill="#22c55e" />
          <circle cx="75" cy="130" r="6" fill="#16a34a" />
          <circle cx="79" cy="136" r="5" fill="#22c55e" />
          <!-- pot plant right -->
          <rect x="245" y="140" width="18" height="15" rx="3" fill="#d4a96a" />
          <circle cx="251" cy="134" r="6" fill="#22c55e" />
          <circle cx="257" cy="130" r="7" fill="#16a34a" />
          <circle cx="261" cy="136" r="5" fill="#22c55e" />
        </svg>
        <!-- Progress dots -->
        <div class="step-dots">
          <div class="step-dot filled"></div>
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
          <div class="step-dot"></div>
        </div>
      </div>

      <div class="card-inner">
        <!-- ── SIGNUP VIEW ── -->
        <div id="signup-view">
          <h2>Seller Registration</h2>
          <p class="form-subtitle">
            Create your partner account to start selling today!
          </p>

          <div id="signup-alert" class="alert alert-error">
            <i
              class="fas fa-exclamation-circle"
              style="flex-shrink: 0; margin-top: 1px"
            ></i>
            <span id="signup-alert-msg"></span>
          </div>

          <form id="signup-form">
            <!-- Full Name -->
            <div class="form-group">
              <label for="full-name">Full Name</label>
              <div class="input-wrap">
                <i class="fas fa-user input-icon"></i>
                <input
                  type="text"
                  id="full-name"
                  placeholder="John Doe"
                  required
                  autocomplete="name"
                />
              </div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="signup-email">Email Address</label>
              <div class="input-wrap">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="signup-email"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="signup-password">Password</label>
              <div class="input-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="signup-password"
                  placeholder="Min. 8 characters"
                  required
                  autocomplete="new-password"
                />
                <button type="button" class="toggle-password" id="toggle-pw">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <!-- Strength indicator -->
              <div
                class="strength-wrap"
                id="strength-wrap"
                style="display: none"
              >
                <div class="strength-bars">
                  <div class="strength-bar" id="bar1"></div>
                  <div class="strength-bar" id="bar2"></div>
                  <div class="strength-bar" id="bar3"></div>
                  <div class="strength-bar" id="bar4"></div>
                </div>
                <div class="strength-text" id="strength-text">Weak</div>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <div class="input-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="confirm-password"
                  placeholder="Re-enter password"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  id="toggle-confirm-pw"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Role is always seller -->
            <input type="hidden" id="selected-role" value="seller" />

            <!-- Terms -->
            <div class="terms-wrap">
              <input type="checkbox" id="terms" required />
              <label for="terms">
                I agree to the <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" id="signup-btn" class="btn-primary">
              <i class="fas fa-user-plus"></i> Create Account
            </button>
          </form>

          <div class="bottom-link">
            Already have an account? <a href="login.html">Log In</a>
          </div>
        </div>

        <!-- ── SUCCESS VIEW ── -->
        <div id="success-view">
          <div class="success-icon"><i class="fas fa-check"></i></div>
          <h2>Account Created!</h2>
          <p id="success-msg">
            Welcome! A verification email has been sent to your inbox.<br />
            Please verify your email before logging in.
          </p>
          <a
            href="login.html"
            class="btn-primary"
            style="
              display: inline-flex;
              text-decoration: none;
              width: auto;
              padding: 0.75rem 2rem;
            "
          >
            <i class="fas fa-sign-in-alt"></i> Go to Login
          </a>
        </div>
      </div>
      <!-- /card-inner -->
    </div>
    <!-- /card -->

    <script type="module" src="./signup.js"></script>
  </body>
</html>
